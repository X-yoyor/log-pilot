<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('异常事件')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('events')}"></nav>
<div th:replace="~{fragments/layout :: msg}"></div>

<div class="container-fluid lp-container">
    <div class="d-flex justify-content-between align-items-center my-3">
        <h5 class="mb-0">异常事件流 <span class="text-muted small">（原始粒度，未聚合）</span></h5>
        <a th:if="${groupId}" class="btn btn-outline-primary btn-sm"
           th:href="@{'/errors/' + ${groupId}}">查看该异常组详情 ›</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-sm table-hover mb-0">
                    <thead>
                    <tr><th>时间</th><th>级别</th><th>异常类</th><th>消息</th><th>日志源</th><th>文件</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(events)}">
                        <td colspan="7" class="text-muted text-center py-5">暂无异常事件（等待采集）</td>
                    </tr>
                    <tr th:each="e : ${events}">
                        <td class="text-nowrap small" th:text="${#temporals.format(e.occurredAt, 'MM-dd HH:mm:ss')}"></td>
                        <td><span class="badge bg-danger" th:text="${e.level}"></span></td>
                        <td class="mono small">
                            <a class="text-reset" th:href="@{'/errors/' + ${e.groupId}}"
                               th:text="'组#' + ${e.groupId}">组#</a>
                        </td>
                        <td class="small text-truncate" style="max-width:340px" th:title="${e.message}" th:text="${e.message}"></td>
                        <td class="small" th:text="${sourceNames[e.sourceId] ?: e.sourceId}"></td>
                        <td class="mono small text-truncate" style="max-width:150px" th:title="${e.filePath}"
                            th:text="${e.filePath}"></td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="collapse"
                                    th:attr="data-bs-target='#ev-' + ${e.id}">详情</button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="collapse mt-2" th:each="e : ${events}" th:attr="id='ev-' + ${e.id}">
        <div class="card card-body">
            <div class="row g-2 small text-muted mb-2">
                <div class="col-md-3">线程: <span class="mono" th:text="${e.thread ?: '-'}"></span></div>
                <div class="col-md-3">Logger: <span class="mono" th:text="${e.logger ?: '-'}"></span></div>
                <div class="col-md-3">入库时间: <span class="mono" th:text="${#temporals.format(e.createdAt, 'MM-dd HH:mm:ss')}"></span></div>
                <div class="col-md-3">指纹: <span class="mono text-truncate d-inline-block" style="max-width:180px"
                     th:text="${e.fingerprint}"></span></div>
            </div>
            <pre class="pre-wrap mb-0" th:text="${e.raw}"></pre>
        </div>
    </div>

    <nav th:if="${page.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/events(groupId=${groupId}, page=${page.number - 1})}">上一页</a>
            </li>
            <li class="page-item disabled"><span class="page-link"
                 th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span></li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/events(groupId=${groupId}, page=${page.number + 1})}">下一页</a>
            </li>
        </ul>
    </nav>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: scripts2}"></script>
</body>
</html>
